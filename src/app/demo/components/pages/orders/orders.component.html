<div class="card">
    <div class="col-12">
        <p-table
        #dt
        [value]="orders"
        [columns]="cols"
        responsiveLayout="scroll"
        [rows]="10"
        [globalFilterFields]="['customer', 'valid']"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10, 20, 30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [(selection)]="selectedOrders"
        selectionMode="multiple"
        [rowHover]="true"
        dataKey="id"
        styleClass="p-datatable-sm p-datatable-gridlines"
    >
        <ng-template pTemplate="caption">
            <div
                class="flex flex-column md:flex-row md:justify-content-between md:align-items-center"
            >
                <h5 class="m-0">Manage Orders</h5>
                <span class="block mt-2 md:mt-0 p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input
                        pInputText
                        type="text"
                        (input)="onGlobalFilter(dt, $event)"
                        placeholder="Search..."
                        class="w-full sm:w-auto"
                    />
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header" >
            <tr >
                <!-- <th style="width: 5px">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th> -->
                <th pSortableColumn="customer">
                    customer 
                </th>
                <th pSortableColumn="date">
                    Date 
                </th>
                <th pSortableColumn="price">
                    Product 
                </th>
                <th pSortableColumn="category">
                    Order 
                </th>
                <th pSortableColumn="rating">
                    Status 
                </th>
                <!-- <th></th> -->
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr [ngClass]="{'valid': !product.view }">
                <!-- <td>
                    <p-tableCheckbox
                        [value]="product"
                    ></p-tableCheckbox>
                </td> -->
                <td style="width: 14%; min-width: 15rem">
                    <span class="p-column-title">Customer</span>
                    {{ product.customer }}
                </td>
                <td style="width: 14%; min-width: 15rem">
                    <span class="p-column-title">Date</span>
                    {{ product.date.toDate().toLocaleDateString() }}
                </td>
                <td style="width: 14%; min-width: 15rem">
                    <span class="p-column-title">Product</span>
                    {{ product.product.label }}
                </td>
                <td style="width: 14%; min-width: 10rem">
                    <span class="p-column-title">Order</span>
                    {{ product.order }}
                </td>
                <td style="width: 14%; min-width: 10rem">
                    <span class="p-column-title">Status</span>
                    <p-tag icon="pi pi-check" *ngIf="product.valid" severity="success" value="Valid"/>
                    <p-tag icon="pi pi-exclamation-triangle" *ngIf="!product.valid" severity="warning" value="Unvalid"/>
                </td>

                <!-- <td>
                    <div class="flex">
                        <button
                            pButton
                            pRipple
                            icon="pi pi-pencil"
                            class="p-button-rounded p-button-success mr-2"
                        ></button>
                        <button
                            pButton
                            pRipple
                            icon="pi pi-trash"
                            class="p-button-rounded p-button-warning"
                        ></button>
                    </div>
                </td> -->
            </tr>
        </ng-template>
    </p-table>
    </div>
</div>
